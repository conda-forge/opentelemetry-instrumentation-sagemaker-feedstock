schema_version: 1

context:
  name: opentelemetry-instrumentation-sagemaker
  version: "0.63.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_sagemaker-${{ version }}.tar.gz
  sha256: 968da17bd995a6ce466df33714db5699431cb6e12bc5cb8791abf1395bb295f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
  run_constraints:
    - boto3 >=1.34.120,<2.0.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - boto3
        - pip
    script:
      - python -c "import opentelemetry.instrumentation.sagemaker"
      - pip check

about:
  summary: OpenTelemetry SageMaker instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
